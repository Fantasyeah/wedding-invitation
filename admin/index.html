<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>赴约登记簿 · 管理后台</title>
    <style>
      :root {
        --ink: #4f302d;
        --cream: #fff1bd;
        --paper: #f3ca7b;
        --wood: #78442e;
        --berry: #bd4f69;
        --berry-dark: #692c4b;
        --night: #21183b;
        --green: #72a954;
        --green-dark: #2f653f;
        --gold: #f4c34f;
      }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: #10131e; font-family: 'Songti SC', 'Microsoft YaHei', 'PingFang SC', sans-serif; -webkit-font-smoothing: none; }
      .wrap { max-width: 720px; margin: 0 auto; padding: 24px 14px 60px; }
      .card { border: 6px solid var(--wood); outline: 4px solid var(--paper-dark); background: var(--cream); box-shadow: inset 0 0 0 3px #ffeab0, 8px 9px #0008; padding: 22px 18px; }
      h1 { margin: 0 0 4px; font-size: 22px; color: var(--berry-dark); text-shadow: 2px 2px #e7a65e; }
      .sub { margin: 0 0 18px; font-size: 12px; color: #7b4935; }

      /* 登录 */
      .login-card { max-width: 360px; margin: 12vh auto 0; text-align: center; }
      .login-card label { display: block; text-align: left; font-size: 12px; font-weight: 700; color: #7b4935; margin-bottom: 6px; }
      .login-card input { width: 100%; padding: 11px; border: 3px solid #7b4935; background: #fffdf3; color: var(--ink); font: inherit; font-size: 14px; }
      .btn { display: inline-block; width: 100%; margin-top: 14px; padding: 12px; border: 4px solid #6e2f42; color: #fff5c9; background: var(--berry); box-shadow: inset 0 0 0 2px #e77b78, 4px 5px #563247; font: inherit; font-size: 14px; font-weight: 900; letter-spacing: .06em; cursor: pointer; }
      .btn:active { transform: translate(3px, 3px); box-shadow: inset 0 0 0 2px #e77b78, 1px 2px #563247; }
      .btn:disabled { filter: grayscale(.5); opacity: .7; cursor: wait; }
      .btn.secondary { border-color: #3c6b45; background: #2f7a63; box-shadow: inset 0 0 0 2px #5aa78a, 4px 5px #1f4a3c; }
      .msg { min-height: 18px; margin: 12px 0 0; font-size: 12px; color: var(--green-dark); }
      .msg.error { color: #a6373f; }

      /* 仪表盘 */
      .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      .toolbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .toolbar .btn { width: auto; margin-top: 0; padding: 9px 14px; font-size: 12px; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 18px; }
      .stat { border: 3px solid #7b4935; background: #ffe9b0; padding: 10px 12px; text-align: center; }
      .stat b { display: block; font-size: 22px; color: var(--berry-dark); }
      .stat span { font-size: 11px; color: #7b4935; }
      .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .filter { padding: 8px 13px; border: 3px solid #7b4935; background: #fffdf3; color: #5e3932; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
      .filter.active { background: #ffe893; border-color: #9f4459; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { border: 2px solid #c88448; padding: 8px 9px; text-align: left; vertical-align: top; }
      th { background: #e8c271; color: #5e3932; font-size: 12px; }
      td { background: #fffdf3; }
      .tag { display: inline-block; padding: 2px 7px; border: 2px solid; font-size: 11px; font-weight: 700; }
      .tag.attending { color: #2f653f; border-color: #2f653f; background: #e3f3d9; }
      .tag.declined { color: #a6373f; border-color: #a6373f; background: #fbe4e4; }
      .muted { color: #8a6b5a; font-size: 12px; }
      .empty { padding: 26px; text-align: center; color: #8a6b5a; font-size: 13px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- 登录 -->
      <div class="card login-card" id="login-view">
        <h1>赴约登记簿</h1>
        <p class="sub">请输入管理密码</p>
        <form id="login-form">
          <label for="password">管理密码</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
          <button class="btn" type="submit" id="login-btn">进入后台</button>
          <p class="msg" id="login-msg" aria-live="polite"></p>
        </form>
      </div>

      <!-- 仪表盘 -->
      <div id="dashboard-view" hidden>
        <div class="card">
          <div class="toolbar">
            <div>
              <h1>赴约登记簿</h1>
              <p class="sub">婚礼赴约名单管理</p>
            </div>
            <div class="actions">
              <button class="btn secondary" type="button" id="refresh-btn">刷新</button>
              <button class="btn secondary" type="button" id="export-btn">导出 CSV</button>
              <button class="btn" type="button" id="logout-btn">退出登录</button>
            </div>
          </div>

          <div class="stats" id="stats"></div>

          <div class="filters" id="filters">
            <button class="filter active" data-filter="all">全部</button>
            <button class="filter" data-filter="attending">参加</button>
            <button class="filter" data-filter="declined">无法参加</button>
            <button class="filter" data-filter="accommodation">需要住宿</button>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>姓名</th><th>是否参加</th><th>人数</th><th>住宿</th><th>电话</th><th>留言</th><th>更新时间</th>
                </tr>
              </thead>
              <tbody id="rsvp-body"></tbody>
            </table>
            <p class="empty" id="empty-tip" hidden>暂无记录</p>
          </div>
          <p class="msg" id="dash-msg" aria-live="polite"></p>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
